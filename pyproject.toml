[project]
name = "mlfromscratch"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Dimon", email = "glinozem@yahoo.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.4.2",
]

[build-system]
requires = ["uv_build>=0.9.22,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

